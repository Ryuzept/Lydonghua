<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StreamDong+</title><!-- Firebase CDN --><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><style>
:root{--red:#e50914;--bg:#0f0f1a;--card:#1c1c2e}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:var(--bg);color:#fff}

/* NAV */
nav{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;background:#121225;position:sticky;top:0;z-index:10}
nav h1{color:var(--red)}
nav .right button{margin-left:10px}

button{background:var(--red);border:none;color:#fff;padding:8px 14px;border-radius:5px;cursor:pointer}

/* HERO */
.hero{height:320px;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.9)),url('https://images.unsplash.com/photo-1525182008055-f88b95ff7980') center/cover;display:flex;align-items:end;padding:30px}
.hero h2{font-size:34px}

section{padding:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px}
.card{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;transition:.3s}
.card img{width:100%;height:230px;object-fit:cover}
.card p{text-align:center;padding:10px}
.card:hover{transform:scale(1.05)}

/* MODAL */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);justify-content:center;align-items:center;z-index:20}
.modal-content{background:var(--card);padding:20px;border-radius:10px;width:95%;max-width:900px}
.close{float:right;cursor:pointer}

.episodes button{margin:5px;background:#333}

/* AUTH */
#authModal input{width:100%;margin:8px 0;padding:8px;border-radius:4px;border:none}

footer{text-align:center;padding:20px;background:#121225;margin-top:40px}
</style></head>
<body><nav>
<h1>StreamDong+</h1>
<div class="right">
<span id="userLabel"></span>
<button onclick="openAuth()">Login</button>
<button onclick="logout()">Logout</button>
</div>
</nav><div class="hero"><h2>Nonton Anime & Donghua Episode Lengkap</h2></div><section>
<h3>Anime & Donghua (Auto dari YouTube Official)</h3>
<input type="text" placeholder="Cari anime / donghua..." onkeyup="search(this.value)">
<br><br>
<div class="grid" id="list"></div>
</section><!-- DETAIL MODAL --><div class="modal" id="detailModal">
<div class="modal-content">
<span class="close" onclick="closeDetail()">✖</span>
<h3 id="detailTitle"></h3>
<iframe id="player" width="100%" height="450" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
<div class="episodes" id="episodeList"></div>
</div>
</div><!-- AUTH MODAL --><div class="modal" id="authModal">
<div class="modal-content">
<span class="close" onclick="closeAuth()">✖</span>
<h3>Login / Register</h3>
<input id="email" placeholder="Email" />
<input id="password" type="password" placeholder="Password" />
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>
</div><footer>© 2026 StreamDong+</footer><script>
// 🔥 FIREBASE CONFIG (ISI SENDIRI)
const firebaseConfig = {
  apiKey: "API_KEY",
  authDomain: "PROJECT.firebaseapp.com",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// DATA
// DATA (LEGAL SOURCE via YouTube embed – official/trailer/demo)
const shows=[
{title:"Attack on Titan (Official)",poster:"https://i.imgur.com/J5LVHEL.jpg",episodes:[
{ep:1,src:"https://www.youtube.com/embed/MGRm4IzK1SQ"}
]},
{title:"Soul Land (Official Donghua)",poster:"https://i.imgur.com/QwZ6Fq9.jpg",episodes:[
{ep:1,src:"https://www.youtube.com/embed/7Tf-7pE9G6I"}
]}
];

// YOUTUBE API AUTO LOAD
const API_KEY = "AIzaSyAEtyXJ9DwidLL4xMsfVgu-TgPoMIU_33Q";
const list = document.getElementById('list');

async function search(q){
 if(q.length < 3) return;
 list.innerHTML = "";
 const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=12&q=${q} anime donghua official&key=${API_KEY}`);
 const data = await res.json();
 data.items.forEach(v=>{
  list.innerHTML += `
   <div class=\"card\" onclick=\"play('https://www.youtube.com/embed/${v.id.videoId}')\">
    <img src=\"${v.snippet.thumbnails.high.url}\">
    <p>${v.snippet.title}</p>
   </div>`;
 });
}

function play(src){
 document.getElementById('detailModal').style.display='flex';
 document.getElementById('player').src = src;
}

function closeDetail(){
 document.getElementById('detailModal').style.display='none';
 document.getElementById('player').src = "";
}

auth.onAuthStateChanged(u=>{
document.getElementById('userLabel').innerText=u?u.email:'Guest';
});
</script></body>
</html>
