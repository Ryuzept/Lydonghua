<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamDong - Nonton Anime & Donghua</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f1a;color:#fff}

/* NAVBAR */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:#121225;
position:sticky;
top:0;
z-index:10
}
nav h1{color:#e50914}
nav input{
padding:8px;
border:none;
border-radius:4px;
width:200px
}

/* HERO */
.hero{
background:url('https://images.unsplash.com/photo-1525182008055-f88b95ff7980') center/cover;
height:300px;
display:flex;
align-items:flex-end;
padding:30px
}
.hero h2{font-size:32px}

/* SECTION */
section{padding:30px}
section h3{margin-bottom:15px}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:20px
}
.card{
cursor:pointer;
transition:.3s
}
.card img{
width:100%;
border-radius:8px
}
.card:hover{transform:scale(1.05)}
.card p{text-align:center;margin-top:5px}

/* MODAL */
.modal{
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.8);
justify-content:center;
align-items:center;
z-index:20
}
.modal-content{
background:#1c1c2e;
padding:20px;
border-radius:10px;
max-width:800px;
width:90%
}
.modal video{
width:100%;
border-radius:8px
}
.close{
float:right;
cursor:pointer;
font-size:20px
}

footer{
text-align:center;
padding:20px;
background:#121225;
margin-top:40px
}
</style>
</head>
<body>

<nav>
<h1>StreamDong</h1>
<input type="text" placeholder="Cari anime..." onkeyup="searchAnime(this.value)">
</nav>

<div class="hero">
<h2>Nonton Anime & Donghua Gratis</h2>
</div>

<section>
<h3>Anime Populer</h3>
<div class="grid" id="animeList">
</div>
</section>

<section>
<h3>Donghua Populer</h3>
<div class="grid" id="donghuaList">
</div>
</section>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">✖</span>
<h3 id="title"></h3>
<video controls id="video">
<source src="" type="video/mp4">
</video>
</div>
</div>

<footer>
<p>© 2026 StreamDong - Demo Frontend</p>
</footer>

<script>
const animeData = [
{title:"Attack on Titan",img:"https://i.imgur.com/J5LVHEL.jpg",video:"https://www.w3schools.com/html/mov_bbb.mp4"},
{title:"Naruto Shippuden",img:"https://i.imgur.com/Wo7v1xN.jpg",video:"https://www.w3schools.com/html/mov_bbb.mp4"},
{title:"One Piece",img:"https://i.imgur.com/UePbdph.jpg",video:"https://www.w3schools.com/html/mov_bbb.mp4"}
];

const donghuaData = [
{title:"Battle Through The Heavens",img:"https://i.imgur.com/8Jr2y9Q.jpg",video:"https://www.w3schools.com/html/mov_bbb.mp4"},
{title:"Soul Land",img:"https://i.imgur.com/QwZ6Fq9.jpg",video:"https://www.w3schools.com/html/mov_bbb.mp4"},
{title:"The King's Avatar",img:"https://i.imgur.com/4X3Jm9z.jpg",video:"https://www.w3schools.com/html/mov_bbb.mp4"}
];

function render(list,element){
element.innerHTML="";
list.forEach(item=>{
element.innerHTML+=`
<div class="card" onclick="play('${item.title}','${item.video}')">
<img src="${item.img}">
<p>${item.title}</p>
</div>`
})
}

render(animeData,document.getElementById("animeList"));
render(donghuaData,document.getElementById("donghuaList"));

function play(title,video){
document.getElementById("modal").style.display="flex";
document.getElementById("title").innerText=title;
document.getElementById("video").src=video;
}

function closeModal(){
document.getElementById("modal").style.display="none";
document.getElementById("video").pause();
}

function searchAnime(keyword){
keyword = keyword.toLowerCase();
const all = [...animeData,...donghuaData];
const filtered = all.filter(a=>a.title.toLowerCase().includes(keyword));
render(filtered,document.getElementById("animeList"));
}
</script>

</body>
</html>
