<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYDONGHUA — Streaming Anime & Donghua</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:radial-gradient(circle at top,#1a1426,#09070f 70%);color:#f5e6c8;padding-bottom:70px}
header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:linear-gradient(90deg,#120c1f,#1f1533);box-shadow:0 2px 12px rgba(255,215,120,.15)}
header h1{color:#f5c97a;font-size:18px;letter-spacing:1px}
header button{background:none;border:none;color:#f5c97a;font-size:13px}
.search{padding:15px}
.search input{width:100%;padding:12px;border-radius:20px;border:none;outline:none;background:#1b1330;color:#f5e6c8}
.section{padding:18px}
.section h3{margin-bottom:10px;font-size:16px}
.hero{display:flex;gap:15px;align-items:center}
.hero img{width:110px;border-radius:12px}
.btn{display:inline-block;margin-top:8px;padding:7px 14px;border-radius:20px;background:linear-gradient(135deg,#f5c97a,#ffd27d);color:#2b1a00;font-size:12px;font-weight:bold;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:linear-gradient(180deg,#1b1330,#0f0a1a);border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(160,120,255,.15)}
.card img{width:100%;height:150px;object-fit:cover}
.card .info{padding:8px}
.card h4{font-size:12px;margin-bottom:3px}
.card span{font-size:11px;color:#aaa}
.progress{height:4px;background:#333;border-radius:4px;overflow:hidden;margin-top:5px}
.progress div{height:100%;background:#f5c97a}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:linear-gradient(90deg,#120c1f,#1f1533);display:flex;justify-content:space-around;align-items:center;border-top:1px solid rgba(255,215,120,.2)}
.bottom-nav a{text-decoration:none;color:#aaa;font-size:11px;text-align:center}
.bottom-nav a.active{color:#ffd27d}
#detailPage{display:none;padding:18px}
#episodeList{display:flex;gap:10px;overflow-x:auto}
#episodeList .card{min-width:90px}
video{width:100%;border-radius:12px}
</style>
</head>
<body>
<header>
<h1>LYDONGHUA</h1>
<button onclick="login()">👤 Akun</button>
</header><div class="search">
<input id="search" placeholder="🔍 Cari anime / donghua...">
</div><section class="section">
<div class="hero">
<img src="https://upload.wikimedia.org/wikipedia/en/9/9f/Battle_Through_the_Heavens_poster.jpg">
<div>
<h3>Battle Through The Heavens</h3>
<span>Donghua • Cultivation</span><br>
<a class="btn" href="#watch">▶ Nonton</a>
</div>
</div>
</section><section class="section">
<h3>🔥 Trending</h3>
<div class="grid" id="list"></div>
</section><section class="section">
<h3>⏱️ Lanjutkan Nonton</h3>
<div class="grid" id="history"></div>
</section><section class="section" id="watch">
<h3>Nonton Episode</h3>
<video id="video" controls poster="https://upload.wikimedia.org/wikipedia/en/9/9f/Battle_Through_the_Heavens_poster.jpg">
<source src="sample.mp4" type="video/mp4">
</video>
</section><div id="detailPage">
<button class="btn" onclick="closeDetail()">← Kembali</button>
<h2 id="dTitle"></h2>
<p id="dGenre"></p>
<div id="episodeList"></div>
</div><div class="bottom-nav">
<a class="active">🏠<br>Home</a>
<a>🎬<br>Anime</a>
<a>🐉<br>Donghua</a>
<a>👤<br>Akun</a>
</div><script>
const data = [
// === DONGHUA ===
{title:'Battle Through The Heavens',genre:'Cultivation, Action',poster:'https://upload.wikimedia.org/wikipedia/en/9/9f/Battle_Through_the_Heavens_poster.jpg'},
{title:'Soul Land',genre:'Cultivation',poster:'https://upload.wikimedia.org/wikipedia/en/8/89/Douluo_Dalu_cover.jpg'},
{title:'Perfect World',genre:'Cultivation',poster:'https://upload.wikimedia.org/wikipedia/en/5/59/Perfect_World_novel.jpg'},
{title:'Martial Universe',genre:'Cultivation',poster:'https://upload.wikimedia.org/wikipedia/en/6/6a/Martial_Universe_novel.jpg'},
{title:'The Great Ruler',genre:'Cultivation',poster:'https://upload.wikimedia.org/wikipedia/en/1/14/The_Great_Ruler_novel.jpg'},
{title:'Swallowed Star',genre:'Sci‑Fi Cultivation',poster:'https://upload.wikimedia.org/wikipedia/en/3/3e/Swallowed_Star_novel.jpg'},
{title:'Apotheosis',genre:'Cultivation',poster:'https://upload.wikimedia.org/wikipedia/en/4/41/Apotheosis_manhua.jpg'},
{title:'Stellar Transformation',genre:'Cultivation',poster:'https://upload.wikimedia.org/wikipedia/en/0/0c/Stellar_Transformation_novel.jpg'},

// === ANIME ===
{title:'Solo Leveling',genre:'Action Fantasy',poster:'https://upload.wikimedia.org/wikipedia/en/3/3a/Solo_Leveling_webtoon_cover.jpg'},
{title:'Jujutsu Kaisen',genre:'Action Supernatural',poster:'https://upload.wikimedia.org/wikipedia/en/4/4f/Jujutsu_Kaisen_volume_1_cover.jpg'},
{title:'Attack on Titan',genre:'Action Drama',poster:'https://upload.wikimedia.org/wikipedia/en/5/5a/Attack_on_Titan_cover.jpg'},
{title:'Demon Slayer',genre:'Action Fantasy',poster:'https://upload.wikimedia.org/wikipedia/en/6/6c/Demon_Slayer_manga_volume_1.jpg'},
{title:'One Piece',genre:'Adventure',poster:'https://upload.wikimedia.org/wikipedia/en/6/6f/One_Piece,_Volume_1.jpg'},
{title:'Naruto',genre:'Ninja Action',poster:'https://upload.wikimedia.org/wikipedia/en/9/94/NarutoCoverTankobon1.jpg'},
{title:'Bleach',genre:'Shinigami Action',poster:'https://upload.wikimedia.org/wikipedia/en/7/72/Bleach_cover_01.jpg'},
{title:'Black Clover',genre:'Magic Action',poster:'https://upload.wikimedia.org/wikipedia/en/9/9b/Black_Clover_volume_1.jpg'},
];

// === AUTO GENERATE RATUSAN DATA (SIMULASI PRODUKSI) ===
const extraTitles = [];
for(let i=1;i<=200;i++){
  extraTitles.push({
    title:`Donghua Cultivation #${i}`,
    genre:'Cultivation Fantasy',
    poster:'https://via.placeholder.com/300x450?text=Donghua+'+i
  });
}
for(let i=1;i<=200;i++){
  extraTitles.push({
    title:`Anime Action #${i}`,
    genre:'Action Fantasy',
    poster:'https://via.placeholder.com/300x450?text=Anime+'+i
  });
}

data.push(...extraTitles);

const list=document.getElementById('list');
data.forEach(d=>{
let c=document.createElement('div');c.className='card';
c.innerHTML=`<img src="${d.poster}"><div class="info"><h4>${d.title}</h4><span>${d.genre}</span></div>`;
c.onclick=()=>openDetail(d);
list.appendChild(c);
});

function openDetail(d){
document.querySelectorAll('section,.search').forEach(e=>e.style.display='none');
detailPage.style.display='block';
dTitle.innerText=d.title;dGenre.innerText=d.genre;episodeList.innerHTML='';
for(let i=1;i<=12;i++){let e=document.createElement('div');e.className='card';e.innerHTML=`<div class="info"><h4>Ep ${i}</h4></div>`;e.onclick=()=>location.href='#watch';episodeList.appendChild(e)}
}
function closeDetail(){location.reload()}

function login(){let u=prompt('Username');if(u)localStorage.setItem('user',u)}

const video=document.getElementById('video');video.addEventListener('timeupdate',()=>{
let p=Math.floor((video.currentTime/video.duration)*100);
localStorage.setItem('progress',p)
});

search.onkeyup=()=>{
let f=search.value.toLowerCase();document.querySelectorAll('.card').forEach(c=>{c.style.display=c.innerText.toLowerCase().includes(f)?'':'none'})
}
</script></body>
</html>
