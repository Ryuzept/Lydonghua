<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lydonghua – Anime & Donghua Streaming</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root{
      --primary:#7c3aed;
      --bg:#0b0b10;
      --card:#141420;
      --text:#ffffff;
    }
    body{
      margin:0;font-family:Arial,Helvetica,sans-serif;
      background:var(--bg);color:var(--text)
    }
    header{
      display:flex;justify-content:space-between;align-items:center;
      padding:14px 16px;background:linear-gradient(90deg,var(--primary),#000)
    }
    header h1{margin:0;font-size:20px}
    #searchInput{
      width:100%;padding:10px;border-radius:8px;border:none;margin:10px 0
    }
    .container{padding:16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
    .card{
      background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer
    }
    .card img{width:100%;height:200px;object-fit:cover}
    .card h4{margin:6px;font-size:14px}
    .card p{margin:6px;font-size:12px;opacity:.7}
    .player{margin-top:16px}
    video{width:100%;border-radius:12px;background:#000}
    .controls{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
    button{
      padding:8px 12px;border:none;border-radius:8px;
      background:var(--primary);color:white;cursor:pointer
    }
    nav{
      position:fixed;bottom:0;left:0;right:0;
      display:flex;justify-content:space-around;
      background:#0f0f1a;padding:10px 0
    }
    nav button{background:none;color:white;font-size:12px}
  </style>
</head>
<body><header>
  <h1>Lydonghua</h1>
  <div>🪙 <span id="coin">120</span> | 👑 VIP</div>
</header><div class="container">
  <input id="searchInput" placeholder="Cari anime atau donghua..." />
  <button onclick="doSearch()">🔍 Cari</button>  <div id="results" class="grid"></div>  <div class="player">
    <h3 id="playerTitle">Pilih Anime</h3>
    <p id="episodeCount"></p>
    <video id="video" controls></video>
    <div class="controls">
      <button onclick="play('ep1','server1')">EP 1 • Server 1</button>
      <button onclick="play('ep1','server2')">EP 1 • Server 2</button>
      <button onclick="play('ep2','server1')">EP 2 • Server 1</button>
    </div>
  </div>
</div><nav>
  <button>🏠 Home</button>
  <button>📂 Catalog</button>
  <button>▶ Player</button>
  <button>🎨 Tema</button>
  <button>👤 Akun</button>
</nav><script>
const video = document.getElementById('video');
let currentEp = 'ep1';

const VIDEO_SOURCES = {
  ep1:{
    server1:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
    server2:'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'
  },
  ep2:{
    server1:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4'
  }
};

function play(ep, server){
  currentEp = ep;
  const url = VIDEO_SOURCES[ep][server];
  if(url.endsWith('.m3u8')){
    if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src = url; video.play();
    } else if(window.Hls){
      const hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
    }
  } else {
    video.src = url; video.play();
  }
}

video.addEventListener('timeupdate',()=>{
  localStorage.setItem(currentEp+'-time', video.currentTime);
});

video.addEventListener('loadedmetadata',()=>{
  const t = localStorage.getItem(currentEp+'-time');
  if(t) video.currentTime = parseFloat(t);
});

video.addEventListener('ended',()=>{
  if(currentEp === 'ep1') play('ep2','server1');
});

async function doSearch(){
  const q = document.getElementById('searchInput').value;
  if(!q) return;
  const res = await fetch('https://api.jikan.moe/v4/anime?q='+q);
  const data = await res.json();
  renderResults(data.data);
}

function renderResults(list){
  const box = document.getElementById('results');
  box.innerHTML='';
  list.slice(0,12).forEach(a=>{
    const d = document.createElement('div');
    d.className='card';
    d.innerHTML=`<img src="${a.images.jpg.image_url}"><h4>${a.title}</h4><p>Episode: ${a.episodes||'?'} </p>`;
    d.onclick=()=>openAnime(a);
    box.appendChild(d);
  });
}

function openAnime(anime){
  document.getElementById('playerTitle').innerText = anime.title;
  document.getElementById('episodeCount').innerText = 'Total Episode: '+(anime.episodes||'?');
  play('ep1','server1');
  saveHistory(anime.title);
}

function saveHistory(title){
  let h = JSON.parse(localStorage.getItem('history')||'[]');
  if(!h.includes(title)) h.push(title);
  localStorage.setItem('history', JSON.stringify(h));
}
</script></body>
</html>
