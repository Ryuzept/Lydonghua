:root{
 --primary:#8b5cf6;
 --bg:#0b0b10;

*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}
.hidden{display:none}

header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#000;position:sticky;top:0;z-index:99}
.logo{font-weight:800;font-size:20px;color:var(--primary)}
.vip-btn{background:gold;color:#000;border:none;border-radius:12px;padding:6px 12px;font-weight:700}

main{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.card{background:var(--surface);border-radius:14px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:170px;object-fit:cover}
.card .title{padding:6px;font-size:13px}

.hero{height:220px;background-size:cover;background-position:center}
.detail{padding:14px}
.episode{padding:10px;margin:6px 0;background:var(--surface);border-radius:10px}

video{width:100%;background:#000;border-radius:14px}

nav{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;justify-content:space-around;padding:10px 0}
nav button{background:none;border:none;color:var(--muted);font-size:12px}
nav button.active{color:var(--primary)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center}
.modal-card{background:var(--surface);padding:20px;border-radius:16px;width:80%;max-width:320px}
.modal-card button{width:100%;margin-top:10px}

.btn{background:var(--primary);color:#fff;border:none;border-radius:14px;padding:10px}

.theme-fab{position:fixed;right:16px;bottom:80px}
.theme-panel{display:none;background:#000;padding:10px;border-radius:16px;gap:8px}
.theme-fab.open .theme-panel{display:flex}
.theme-btn{width:24px;height:24px;border-radius:50%;border:none}
</style></head>

function closeLogin(){loginModal.classList.add('hidden')}

// AUTO ANIME & DONGHUA (HUNDREDS VIA API)
let page=1;const LIMIT_PAGES=5; // ~125 anime (5x25)
function loadAnime(){
 if(page>LIMIT_PAGES) return;
 fetch(`https://api.jikan.moe/v4/top/anime?page=${page}`)
  .then(r=>r.json()).then(d=>{
   d.data.forEach(a=>{
 addToGenre(a);
    const c=document.createElement('div');c.className='card'
    c.innerHTML=`<img src="${a.images.jpg.image_url}"><div class="title">${a.title}</div>`
    c.onclick=()=>openDetail({title:a.title,eps:a.episodes||1,poster:a.images.jpg.image_url})
    homeGrid.appendChild(c)
   })
   page++; loadAnime();

// ===== REKOMENDASI OTOMATIS (UNTUK KAMU) =====
const recoGrid=document.getElementById('recoGrid');
function renderReco(){
 const h=JSON.parse(localStorage.getItem('history')||'[]');
 if(h.length===0) return;
 recoGrid.innerHTML='';
 const keywords=h.slice(-3);
 fetch('https://api.jikan.moe/v4/anime?q='+encodeURIComponent(keywords[0])+'&limit=6')
  .then(r=>r.json()).then(d=>{
   d.data.forEach(a=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<img src="${a.images.jpg.image_url}"><div class="title">${a.title}</div>`;
    c.onclick=()=>openDetail({title:a.title,eps:a.episodes||1,poster:a.images.jpg.image_url});
    recoGrid.appendChild(c);
   })
  })
}
setTimeout(renderReco,2000);

// ===== GENRE SYSTEM OTOMATIS =====
const genreMap={};
function addToGenre(anime){
 if(!anime.genres) return;
 anime.genres.forEach(g=>{
  if(!genreMap[g.name]) genreMap[g.name]=[];
  genreMap[g.name].push(anime);
 });
 renderGenres();
}
function renderGenres(){
 const gl=document.getElementById('genreList');
 if(!gl) return;
 gl.innerHTML='';
 Object.keys(genreMap).forEach(name=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="title">${name} (${genreMap[name].length})</div>`;
  c.onclick=()=>{
    homeGrid.innerHTML='';
    genreMap[name].forEach(a=>{
      const cc=document.createElement('div');cc.className='card';
      cc.innerHTML=`<img src="${a.images.jpg.image_url}"><div class="title">${a.title}</div>`;
      cc.onclick=()=>openDetail({title:a.title,eps:a.episodes||1,poster:a.images.jpg.image_url});
      homeGrid.appendChild(cc);
    });
    show('home');
  }
  gl.appendChild(c);
 });
}
 // auto load next page
  })
}
